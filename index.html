*{

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#ff005522,transparent 35%),
radial-gradient(circle at bottom,#0055ff22,transparent 35%);

}
/* PAGE */
.page{
width:100%;
max-width:480px;
margin:auto;

/* HEADER */
.header{
padding:18px;

.logo span{

/* VIDEO CARD */
.video-card{
margin:12px;
background:#111;
border-radius:24px;
overflow:hidden;
box-shadow:
0 0 0 1px rgba(255,255,255,0.05),
0 20px 40px rgba(0,0,0,0.45);
}
/* VIDEO */
.video-box{
position:relative;
background:#000;
min-height:250px; /* Menjaga tinggi awal saat loading */
}
video{
width:100%;
max-height:75vh;
display:block;
object-fit:contain;
background:#000;
}
.video-box::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:120px;
background:linear-gradient(to top,#000000dd,transparent);
pointer-events:none;
}
/* THUMBNAIL OVERLAY */
#thumbnailOverlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  z-index:20;
  background:#000;
  cursor:pointer;
}
#thumbnailOverlay.hidden{display:none;}
#thumbnailPlay{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  background:rgba(255,47,109,0.95);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  z-index:21;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.45);
}
#thumbnailPlay.hidden{display:none;}

/* VIDEO LOADER */
#videoLoader {
position:absolute;
inset:0;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:600;
letter-spacing:0.5px;
z-index:10;
}
/* BADGE */
.badge{
position:absolute;
top:12px;
left:12px;
background:#ff2f6d;
padding:8px 12px;
border-radius:50px;
font-size:12px;
font-weight:700;
z-index:5;
box-shadow:0 5px 15px rgba(255,0,102,0.4);
}
/* INFO */
.video-info{
padding:16px;
}
.video-title{
font-size:20px;
font-weight:700;
line-height:1.4;
}
.video-desc{
margin-top:10px;
color:#aaa;
font-size:14px;
line-height:1.6;
}
.stats{
display:flex;
gap:14px;
margin-top:14px;
color:#ccc;
font-size:13px;
flex-wrap:wrap;
}
/* BUTTONS */
.actions{
display:flex;
gap:10px;
margin-top:18px;
}
.btn{
flex:1;
border:none;
border-radius:16px;
padding:15px;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:0.25s;
}
.btn-primary{
background:linear-gradient(135deg,#ff2f6d,#ff0066);
color:#fff;
box-shadow:0 10px 25px rgba(255,0,102,0.35);
}
.btn-primary:hover{
transform:translateY(-2px);
}
.btn-secondary{
background:#1b1b1b;
color:#fff;
}
/* SECTION */
.section-title{
padding:18px 16px 10px;
font-size:18px;
font-weight:700;
}
/* ADS */
.ads-card{
margin:12px;
background:#121212;
border-radius:20px;
padding:14px;
border:1px solid rgba(255,255,255,0.05);
overflow:hidden;
}
.ads-label{
color:#777;
font-size:11px;
text-transform:uppercase;
margin-bottom:12px;
letter-spacing:1px;
}
/* FOOTER */
.footer{
text-align:center;
color:#666;
font-size:12px;
padding:30px 15px;
}
/* MOBILE */
@media(max-width:480px){
.video-title{ font-size:18px; }
}

(function () {

  /* =========================
     SMARTLINK
  ========================= */
  const smartlink = "https://shorturl.at/NR4w2";

  /* WATCH MORE & DOWNLOAD */
  document.getElementById("watchBtn").addEventListener("click", function () {
    window.open(smartlink, "_blank");
  });

  document.getElementById("downloadBtn").addEventListener("click", function () {
    window.open(smartlink, "_blank");
  });

  /* =========================
     VIDEO PARAM
  ========================= */
  const params = new URLSearchParams(window.location.search);
  let video = params.get("v");

  // URL thumbnail. Bisa diganti lewat ?thumb=URL_FOTO
  // Contoh: ?v=t0Ya8oBH1&thumb=https://domain.com/foto.jpg
  const thumbnail = "https://i.ibb.co.com/21FWbT3k/Screenshot-2026-08-17-062544.png";

  if (!video) {
      video = "t0Ya8oBH1";
  }
  if (!video.startsWith("http")) {
      video = "https://cdn.videy.co/" + video;
  }
  if (!video.endsWith(".mp4")) {
      video += ".mp4";
  }

  const player = document.getElementById("player");
  const source = document.getElementById("videoSource");
  const thumbnailOverlay = document.getElementById("thumbnailOverlay");
  const thumbnailPlay = document.getElementById("thumbnailPlay");

  source.src = video;
  thumbnailOverlay.src = thumbnail;

  // Tidak autoplay
  player.autoplay = false;
  player.removeAttribute("autoplay");
  player.load();

  // Video hanya berjalan setelah thumbnail/Play ditekan
  function startVideo(){
    thumbnailOverlay.classList.add("hidden");
    thumbnailPlay.classList.add("hidden");
    player.play().catch(() => {});
  }

  thumbnailOverlay.addEventListener("click", startVideo);
  thumbnailPlay.addEventListener("click", startVideo);

  // Disable klik kanan
  player.addEventListener("contextmenu", e => e.preventDefault());

  })();
//]]>
